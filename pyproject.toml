[project]
name = "python-template-linux"
version = "0.1.0"
description = "Template universal e reprodutivo para projetos Python em Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
python-template = "python_template_linux.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
# Os testes usam tomllib do Python >=3.11; o pacote conserva o piso 3.10.
extra-standard-library = ["tomllib"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
