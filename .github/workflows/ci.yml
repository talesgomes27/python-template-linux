name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Configurar Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sincronizar dependências
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Conferir interpretador da matriz
        run: |
          uv run python - <<'PY'
          import os
          import sys
          expected = os.environ["UV_PYTHON"]
          actual = ".".join(map(str, sys.version_info[:2]))
          print(f"Python {actual} (esperado {expected})")
          assert actual == expected
          PY

      - name: Checagem de formatação (Ruff)
        run: uv run ruff format --check .

      - name: Análise estática (Ruff)
        run: uv run ruff check .

      - name: Executar testes unitários (pytest)
        run: uv run pytest -v
