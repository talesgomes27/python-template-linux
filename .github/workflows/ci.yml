name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Configurar Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sincronizar dependências
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Conferir interpretador da matriz
        run: |
          uv run python - <<'PY'
          import os
          import sys
          expected = os.environ["UV_PYTHON"]
          actual = ".".join(map(str, sys.version_info[:2]))
          print(f"Python {actual} (esperado {expected})")
          assert actual == expected
          PY

      - name: Checagem de formatação (Ruff)
        run: uv run ruff format --check .

      - name: Análise estática (Ruff)
        run: uv run ruff check .

      - name: Executar testes unitários (pytest)
        run: uv run pytest -v
